<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ツール置き場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  /* 構成: 見出しと、ツールへのリンクを縦に並べた目次。リンクは1行ずつ広く押せる */
  --bg:#eceff5; --surface:#ffffff; --line:#d3dae7;
  --fg:#121a2b; --muted:#5a6780; --accent:#f5a31a; --accent-fg:#1c1303;
  --f-display:"Barlow Condensed","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c121e; --surface:#141c2c; --line:#28344e;
    --fg:#e7ecf6; --muted:#8d9ab3; --accent:#f7ac2c; --accent-fg:#1c1303;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 var(--f-body);
  padding-block:40px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
main{max-width:640px;margin:0 auto}
h1{margin:0;font:700 36px/1.1 var(--f-display);letter-spacing:.06em}
.lead{margin:8px 0 28px;color:var(--muted)}
h2{margin:0 0 10px;font:700 14px var(--f-display);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
ul{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
li + li{border-top:1px solid var(--line)}
a.item{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;
  padding:16px 18px;color:inherit;text-decoration:none;
}
a.item:hover{background:var(--bg)}
a.item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.name{font-weight:700;font-size:16px}
.desc{grid-column:1;color:var(--muted);font-size:13px}
.go{grid-row:1 / span 2;grid-column:2;font:700 20px var(--f-display);color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>ツール置き場</h1>
  <p class="lead">ツールの一覧です。</p>
  <h2>ツール</h2>
  <ul>
    <li>
      <a class="item" href="https://takuma-h.github.io/ow-team-splitter/index.html">
        <span class="name">OWカスタム チーム分け</span>
        <span class="desc">オーバーウォッチのカスタム用。ランクと希望ロールから、戦力差が小さくなるようにチームを分けます。</span>
        <span class="go" aria-hidden="true">→</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
